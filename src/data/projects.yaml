- id: ws
  order: 1
  kind: mine
  name: ws
  tech: [Go, TUI, CLI]
  description: >-
    A workspace switcher and scaffolding tool. Fuzzy-search your projects
    from a TUI, jump into one, or start a new one from a template.
  repo: https://github.com/akalp/ws
  note: >-
    every experiment gets a dated folder now. my home directory has never
    been this tidy.
  media:
    kind: terminal
    label: A terminal recording of ws. The fuzzy-search TUI opens a workspace, then ws new scaffolds a Go project.
    src: ../assets/made/ws-tui.gif
    still: ../assets/made/ws-tui-still.png
  card:
    tech: Go · TUI
    description: >-
      A workspace switcher and scaffolder with a fuzzy-search TUI and project
      templates.

